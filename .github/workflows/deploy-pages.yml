name: Deploy RoadFit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh vehicle catalog", "Refresh vehicle cover photos"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Project Pages base path
        shell: bash
        env:
          BASE_PATH_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          if [[ -n "$BASE_PATH_OVERRIDE" ]]; then
            base="${BASE_PATH_OVERRIDE#/}"
            base="${base%/}"
            if [[ -n "$base" ]]; then
              echo "VITE_BASE_PATH=/$base/" >> "$GITHUB_ENV"
            else
              echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            fi
          elif [[ "${repo_name,,}" == "${owner,,}.github.io" ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$repo_name/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate catalog and cover photos
        run: |
          python3 -m unittest discover -s scripts/data -p 'test_*.py'
          python3 scripts/data/validate_catalog.py
          python3 scripts/data/build_vehicle_photos.py --validate

      - name: Build static app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
