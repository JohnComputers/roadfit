name: Test Supabase RLS

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase
        run: supabase start
      - name: Apply migrations and run pgTAP
        run: |
          supabase db reset
          supabase test db
